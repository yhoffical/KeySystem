name: Update

# Button: Actions tab > Update > Run workflow
# Shows a "What's New" popup once to every visitor.

on:
  workflow_dispatch:
    inputs:
      text:
        description: "What was added (separate points with |)"
        required: true
        type: string
      version:
        description: "Version label (optional, example: v1.2)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write whatsnew.json
        env:
          TEXT: ${{ inputs.text }}
          VERSION: ${{ inputs.version }}
        run: |
          jq -n --arg t "$TEXT" --arg v "$VERSION" --arg u "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{enabled:true, title:"What’s New", version:$v, lines:($t|split("|")|map(gsub("^\\s+|\\s+$";""))|map(select(length>0))), updated:$u}' > whatsnew.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsnew.json
          git commit -m "update notice" || exit 0
          git pull --rebase
          git push
