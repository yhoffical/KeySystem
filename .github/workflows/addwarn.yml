name: AddWarn

# Button: Actions tab > AddWarn > Run workflow
# Shows the warning popup again to every visitor with the new text.

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Warning text (separate lines with |)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write notice.json
        env:
          TEXT: ${{ inputs.text }}
        run: |
          jq -n --arg t "$TEXT" --arg u "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{enabled:true, title:"Warning", lines:($t|split("|")|map(gsub("^\\s+|\\s+$";""))|map(select(length>0))), updated:$u}' > notice.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notice.json
          git commit -m "new warning" || exit 0
          git pull --rebase
          git push
