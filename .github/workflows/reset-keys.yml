name: Reset keys

# Button: Actions tab > Reset keys > Run workflow
# Needs the repository secret ADMIN_KEY (never write the key in this file, the repo is public)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Invalidate every key on the server
        env:
          KEY_API_URL: https://script.google.com/macros/s/AKfycbwpKKB9WPRemIOnbja-oUV3AtQPL5nUBAGzbzv9PzolGTAEGxzJ8qJ9MkXmJxS3q4Bs/exec
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then echo "Missing secret ADMIN_KEY"; exit 1; fi
          BODY=$(jq -n --arg a "$ADMIN_KEY" '{action:"reset",admin:$a}')
          RES=$(curl -sL --max-time 60 --data "$BODY" -H "Content-Type: text/plain" "$KEY_API_URL")
          echo "Server answer: ${RES:0:300}"
          if ! echo "$RES" | jq -e '.ok == true' > /dev/null 2>&1; then
            echo "Reset failed. denied = wrong ADMIN_KEY, bad_action/bad_request = old Apps Script code, html = deployment access is not Anyone"
            exit 1
          fi
          echo "All keys were reset"

      - name: Tell the site to clear stored keys
        run: |
          jq --arg r "$(date -u +%s)" '.reset = $r' update.json > u.tmp && mv u.tmp update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "keys reset" || exit 0
          git pull --rebase
          git push
